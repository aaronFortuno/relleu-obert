name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the stalled Pages deployment from run 112
        if: github.event.before == '7b90bbf11b6847587a148a71161df92a7fc77673'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployment=7b90bbf11b6847587a148a71161df92a7fc77673
          status=$(curl --silent --show-error --max-time 30 \
            --output /dev/null --write-out '%{http_code}' --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/deployments/$deployment/cancel")
          echo "Pages cancellation returned HTTP $status"
          [[ "$status" == 204 || "$status" == 404 ]]
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
